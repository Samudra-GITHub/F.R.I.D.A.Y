<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 110" width="1200" height="110" role="img" aria-labelledby="t">
  <title id="t">Watchful Earth-Data Navigator, Entirely Self-hosted Desktop Assistant for You</title>
  <defs>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8fb8ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8fb8ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#8fb8ff" stop-opacity="0"/>
    </linearGradient>
    <style>
      .w { opacity: 0; animation: in 0.6s ease-out forwards; }
      .i { fill: #e9b872; font-weight: 700; }
      .r { fill: #aab1bf; }
      .w:nth-child(1) { animation-delay: 0.1s; }
      .w:nth-child(2) { animation-delay: 0.35s; }
      .w:nth-child(3) { animation-delay: 0.6s; }
      .w:nth-child(4) { animation-delay: 0.85s; }
      .w:nth-child(5) { animation-delay: 1.1s; }
      .w:nth-child(6) { animation-delay: 1.35s; }
      .w:nth-child(7) { animation-delay: 1.6s; }
      .w:nth-child(8) { animation-delay: 1.85s; }
      .w:nth-child(9) { animation-delay: 2.1s; }
      .w:nth-child(10) { animation-delay: 2.35s; }
      @keyframes in { to { opacity: 1; } }
      .line { animation: sweep 6s ease-in-out 2.6s infinite; transform: translateX(-400px); }
      @keyframes sweep { 0% { transform: translateX(-400px); } 60%, 100% { transform: translateX(1200px); } }
      @media (prefers-reduced-motion: reduce) { .w { animation: none; opacity: 1; } .line { animation: none; opacity: 0; } }
    </style>
  </defs>
  <rect width="1200" height="110" rx="14" fill="#090b10"/>
  <text x="600" y="62" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="27" letter-spacing="0.5"><tspan class="w"><tspan class="i">W</tspan><tspan class="r">atchful </tspan></tspan><tspan class="w"><tspan class="i">E</tspan><tspan class="r">arth-</tspan></tspan><tspan class="w"><tspan class="i">D</tspan><tspan class="r">ata </tspan></tspan><tspan class="w"><tspan class="i">N</tspan><tspan class="r">avigator, </tspan></tspan><tspan class="w"><tspan class="i">E</tspan><tspan class="r">ntirely </tspan></tspan><tspan class="w"><tspan class="i">S</tspan><tspan class="r">elf-hosted </tspan></tspan><tspan class="w"><tspan class="i">D</tspan><tspan class="r">esktop </tspan></tspan><tspan class="w"><tspan class="i">A</tspan><tspan class="r">ssistant </tspan></tspan><tspan class="w"><tspan class="r">for </tspan></tspan><tspan class="w"><tspan class="i">Y</tspan><tspan class="r">ou</tspan></tspan></text>
  <rect class="line" x="0" y="84" width="400" height="2" fill="url(#sweep)"/>
</svg>
