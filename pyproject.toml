[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "friday"
version = "0.1.0"
description = "W.E.D.N.E.S.D.A.Y. — Personal AI Desktop Assistant"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Samudra Kar" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "httpx>=0.27.0",
    "sgp4>=2.23",
]

[project.optional-dependencies]
# Offline speech recognition. Weights are downloaded separately; see docs/overhaul/handoff.md.
whisper = [
    "faster-whisper>=1.2,<2",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["backend"]
